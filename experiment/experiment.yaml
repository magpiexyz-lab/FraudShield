# --- 6. Funnel ---
funnel:
  available_from:
    reach: L1
    demand: L1
    activate: L2
    monetize: L2
    retain: L3
  decision_framework:
    scale: "All tested dimensions >= 1.0"
    kill: "Any top-funnel (REACH or DEMAND) < 0.5"
    pivot: "2+ dimensions < 0.8"
    refine: "1+ dimensions < 1.0 but fewer than 2 below 0.8"

# --- 7. Stack + Deploy ---
stack:
  services:
    - name: app
      runtime: nextjs
      hosting: vercel
      ui: shadcn
      testing: playwright
  database: supabase
  auth: supabase
  auth_providers: [google]     # Google OAuth — configured in the Supabase dashboard
  analytics: posthog
  payment: stripe              # Level 3 + monetize hypotheses → payment required
  ai: anthropic                # Claude Opus 5 vision — content analysis for image
                               # uploads, where metadata forensics cannot score the
                               # document itself (src/lib/fraud/vision.ts).
                               # Requires ANTHROPIC_API_KEY; absent key degrades
                               # image scans to the partial (EXIF-only) analysis.

target_geo: [US, GB, CA, AU, NZ]

deploy:
  url: null
  repo: null
  domain: null
