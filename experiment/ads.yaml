budget:
  # v2's stop condition is measured in ASKS, not clicks -- see thresholds.pass_bar.
  # click_target is kept because the validator and cross-MVP readers expect it,
  # and is set to the clicks needed to reach 75 asks at v1's funnel (~28% of
  # clicks produced a paywall render). RE-DERIVE from the real
  # paywall_shown/click ratio after 2-3 days: 28% comes from v1, whose /pricing
  # sat behind the auth wall and was unreachable for signed-out visitors, so the
  # true v2 rate should be higher and this number too pessimistic.
  click_target: 270
  total_budget_cents: 150000
  daily_budget_cents: 3500
  duration_days: 43
  # v1 opened at 140 (SGD 1.90) and produced 3 clicks in 6 days: Google reported
  # first-page bids of SGD 5.76-12.96 for these keywords, so the campaign was
  # priced out of the auction entirely. Open v2 at the approved ceiling -- the
  # measured avg CPC once it was serving was SGD 6.54, just under it.
  initial_max_cpc_cents: 500
  bidding_strategy: manual_cpc
  # NOT re-approved for v2. Alan's USD 1,500 authorisation covered v1, which
  # spent SGD 1,380 of it before being paused at 211 clicks with zero
  # pay-intents. The figures above are what the ask-based bar requires, not an
  # approved cap.
  cap_override_approved_by: re-approved for v2 at USD 1,500 (confirmed 2026-09-02)
  duration_note: 'v2 runs at USD 35/day (SGD 47) per the fleet re-fly brief.
    38 x 35 = USD 1,330, which is what reaching 75 asks costs at the SGD 6.54
    CPC v1 measured and an estimated 28% ask-per-click rate. The end date is a
    fail-safe, not a deadline: stop on the pass bar, and re-derive the date once
    the real ask rate is known.'
guardrails:
  max_cpc_cents: 500
  min_daily_clicks: 3
  auto_pause_rules:
  - condition: daily_spend_cents > daily_budget_cents * 1.2
    action: pause_campaign
    reason: Daily spend exceeded budget by 20%
  - condition: ctr < 0.005 AND impressions > 1000
    action: pause_ad_group
    reason: CTR below 0.5% after 1000 impressions — copy is failing
  - condition: cost_per_click_cents > 500
    action: pause_keyword
    reason: CPC exceeded ~2x guardrail ($2.40) — keyword is over-competitive
thresholds:
  expected_clicks: 270
  expected_signups: 62
  expected_activations: 3
  # The v2 denominator is ASKS (paywall_shown), not clicks. v1 could not tell
  # "nobody wants to pay" from "nobody was ever asked" -- both look like a zero
  # rate -- and that ambiguity is what it died on: 211 clicks, ~35 scanners, 0
  # pay-intents, with the full report given away free and the CTA a screen below
  # the fold.
  pass_bar:
    denominator: paywall_shown from real users (probe+%@draftlabs.org excluded)
    promote: '>= 75 asks AND >= 3 pay_intents'
    kill: 0 pay_intents across >= 30 asks
    note: >-
      The kill rule resolves far sooner than the promote rule -- ~30 asks versus
      75 -- so a failure lands in about a week while a pass takes the full run.
      Do not read an early sub-75 number as a promote failure.
  go_signal: '>= 3 pay_intents over >= 75 asks (paywall_shown) -> GO: eligible
    for Phase 3, ranked by revenue_intent_per_click'
  no_go_signal: '0 pay_intents across >= 30 asks -> NO_GO (saw the price, did
    not buy). OR spend reaches the approved cap before 30 asks -> inconclusive,
    NOT a verdict: the ask was never put to enough people.'
currency: SGD
currency_note: 'The Google Ads account bills in SGD but every approved figure below is USD, derived from
  the USD 60/mo reference price. Entered into Google Ads at ~1.35 SGD/USD: bid SGD 1.90, daily SGD 135,
  ceiling SGD 6.75, cap SGD 2025. The validator is currency-blind, so it would accept SGD figures as if
  they were dollars -- keep this note when editing. Phase 1''s recorded avg CPC of 3.80 was almost certainly
  SGD (~USD 2.85), which means the Phase 1b bid cut may have been triggered by a currency mismatch rather
  than real payback failure.'
