# experiment.yaml — FraudShield
# Generated by /spec. Source of truth for what to build.

# --- 1. Identity ---
name: fraudshield
owner: magpie                  # Used as project_owner in analytics.
type: web-app
level: 3                       # Full MVP: auth + payments + complete features
status: draft
quality: production

# --- 2. Intent ---
description: |
  Small lenders, landlords, gig platforms, and small employers are being hit by a
  2025 explosion in AI-generated document fraud — fake pay stubs, bank statements,
  and invoices that anyone can produce in seconds from sub-$10 templates. Enterprise
  tools (Inscribe, Findigs) only serve big banks at quote-based pricing, leaving small
  operators with nothing affordable. FraudShield is a self-serve detection dashboard +
  API where they upload a document and get a forensic fraud score in seconds — using
  metadata forensics, cross-document checks, and a known-fraud-template database.

thesis: "If small lenders, landlords, and gig platforms can upload a document and get a trustworthy fraud score in seconds at an affordable self-serve price, then 8%+ of activated users will convert to a paid plan within 2 weeks, as measured by Stripe checkout completions"

target_user: "Small/regional lenders, MCA brokers, independent landlords and property managers, gig-platform trust teams, and SMB finance/AP staff who manually review pay stubs, bank statements, and invoices and have no affordable fraud-detection tool"

distribution: |
  Post in r/Landlord, r/PropertyManagement, r/smallbusiness, and MCA/lending broker forums.
  LinkedIn outreach to small-lender underwriters and property managers.
  Targeted Google/Reddit ads against "fake pay stub" / "verify bank statement" intent.
  Cold outreach to 50 gig-platform trust & safety leads.

hypotheses:
  - id: h-01
    category: demand
    statement: ">5% of landing visitors click the primary 'Scan your document' CTA"
    metric:
      formula: "cta_click / visit_landing"
      threshold: 0.05
      operator: gte
    priority_score: 92
    experiment_level: 1
    depends_on: []
    status: pending
  - id: h-02
    category: reach
    statement: ">5% of landing visitors submit a document for a free scan (qualified reach — they have the pain and a document to check)"
    metric:
      formula: "free_scan_start / visit_landing"
      # RE-POINTED 2026-11-04. Was "demo_view / visit_landing" at threshold 0.35,
      # measuring a click on a canned animation over a fixed sample document.
      # The animation is gone; the surface now runs a real scan on the visitor's
      # own image, so the numerator changed and rates before and after are NOT
      # comparable. The old series ran at 1.1% (3 demo_view / 274 visit_landing
      # over 7 days; 4 / 352 over 14) — i.e. it scored 0.031 against its own
      # threshold and had been tripping the kill rule all along. 0.35 was never
      # grounded in anything.
      #
      # PLACEHOLDER pending the manager's number, same status as h-11's. 0.05 is
      # ~4.5x the old demo rate, chosen because uploading a document off your own
      # disk is a far higher-friction act than clicking Run on an animation, so a
      # lower bar is warranted — but it is an estimate, not evidence.
      #
      # The numerator counts ATTEMPTS: free_scan_start fires on request submission,
      # before the cap check and before the AI call, so a capped or failed scan
      # still counts. This hypothesis is therefore UNREADABLE unless h-12 (the
      # delivery rate) also passes — h-02 alone is satisfiable by a surface that
      # refuses or fails every request.
      threshold: 0.05
      operator: gte
    priority_score: 85
    experiment_level: 1
    depends_on: []
    status: pending
  - id: h-03
    category: activate
    statement: ">35% of signed-up users upload a real document and receive a fraud score in their first session"
    metric:
      formula: "activate / signup_complete"
      threshold: 0.35
      operator: gte
    priority_score: 88
    experiment_level: 2
    depends_on: [h-01]
    status: pending
  - id: h-04
    category: monetize
    statement: ">8% of users who receive a fraud score complete a paid checkout after hitting the free-scan limit"
    metric:
      formula: "subscription_activated / activate"
      threshold: 0.08
      operator: gte
    priority_score: 78
    experiment_level: 3
    depends_on: [h-03]
    status: pending
  - id: h-05
    category: retain
    statement: ">40% of users who run one scan return to run another within 14 days"
    metric:
      formula: "retain_return / activate"
      threshold: 0.40
      operator: gte
    priority_score: 68
    experiment_level: 3
    depends_on: [h-03]
    status: pending
  - id: h-06
    category: demand
    statement: ">15% of activated users click 'Get API access' (fake door), signaling B2B integration demand"
    metric:
      formula: "api_interest_click / activate"
      threshold: 0.15
      operator: gte
    priority_score: 60
    experiment_level: 2
    depends_on: [h-03]
    status: pending
  - id: h-07
    category: demand
    statement: "An active, paid market for document-fraud detection already exists"
    evidence:
      source: "Competitor & market scan, May 2026"
      verdict: "Inscribe (category creator since 2017), Findigs, Resistant AI, Heron, Ocrolus, and FraudFinder all sell document-fraud detection with named paying customers (BHG Financial, Ramp, Viva Finance) — pass"
      citation: "Inscribe 2026 State of Document Fraud Report; American Banker 'This is an arms race' (2025)"
    priority_score: 60
    experiment_level: 1
    depends_on: []
    status: resolved
  - id: h-08
    category: demand
    statement: "The problem is real, urgent, and accelerating"
    evidence:
      source: "Inscribe 2026 report + Sumsub Q1 2025 + Frank on Fraud"
      verdict: "AI-generated document fraud up ~5x Apr–Dec 2025; ~6% (1 in 16) documents flagged; fake pay stubs up 500%; editable templates sell for <$10 — pass"
      citation: "inscribe.ai/reports/2026-document-fraud-report; frankonfraud.com 500% paystub report"
    priority_score: 58
    experiment_level: 1
    depends_on: []
    status: resolved
  - id: h-09
    category: reach
    statement: "A genuine competitive gap exists for the small/underserved segment"
    evidence:
      source: "Competitor pricing scan, May 2026"
      verdict: "All incumbents are enterprise/quote-based, API-first, and aimed at banks and large lenders; no affordable self-serve option exists for small lenders, landlords, gig platforms, or SMBs — gap confirmed"
      citation: "inscribe.ai, findigs.com, klippa.com vendor pages"
    priority_score: 55
    experiment_level: 1
    depends_on: []
    status: resolved
  - id: h-10
    category: reach
    statement: "A specific, reachable ICP can be identified"
    evidence:
      source: "ICP synthesis, May 2026"
      verdict: "Independent landlords, small lenders/MCA brokers, gig-platform trust teams, and SMB AP staff are reachable via r/Landlord, lending-broker forums, and LinkedIn — pass (medium confidence)"
      citation: ".runs/spec-research.json"
    priority_score: 52
    experiment_level: 1
    depends_on: []
    status: resolved
  - id: h-11
    category: demand
    statement: ">3% of guide readers click through to sign up (organic search is a viable acquisition channel, not just paid)"
    metric:
      formula: "guide_cta_click / guide_view"
      # PLACEHOLDER pending the manager's number. Nearest anchors are h-01 at 0.05
      # (landing CTA, buying intent) and h-02 at 0.35 (demo engagement). Informational
      # search traffic converts differently and nothing in this repo benchmarks it, so
      # this threshold is an estimate, not evidence. Set too high it returns REJECTED
      # on the only organic channel; too low it confirms on noise.
      threshold: 0.03
      operator: gte
    # Deliberately below h-02's 85 so this does not take over a Validation Scorecard
    # row. A brand-new unseeded SEO metric must not be able to drive the kill rule
    # ("Any top-funnel (REACH or DEMAND) < 0.5") on an experiment whose paid funnel
    # is healthy. h-01 holds DEMAND at 92.
    priority_score: 60
    experiment_level: 1
    depends_on: []
    status: pending
  - id: h-12
    category: reach
    statement: ">80% of free-scan submissions receive a completed AI verdict (the free scan actually delivers — h-02's attempt rate is unreadable without this)"
    metric:
      formula: "free_scan_complete / free_scan_start"
      # ADDED 2026-11-04 alongside the h-02 re-point. This exists because h-02's
      # numerator fires on submission, so a surface that 429s or fails every
      # request still scores h-02 high. A hypothesis carries exactly one metric,
      # so the delivery rate cannot live inside h-02 and needs its own row.
      #
      # free_scan_complete fires only when the vision pass actually ran. It does
      # NOT fire for: either cap refusing (free_scan_capped instead), an
      # undecodable image, a refused PDF, or a metadata-only partial result.
      #
      # PLACEHOLDER pending the manager's number. 0.8 allows for the daily cap
      # being reached legitimately and for occasional Anthropic unavailability,
      # while still failing loudly if the surface is broadly broken.
      threshold: 0.8
      operator: gte
    # Below h-02's 85 deliberately: this is a health check on h-02's denominator,
    # not an independent acquisition claim, and it must not drive the kill rule
    # ("Any top-funnel (REACH or DEMAND) < 0.5") on its own.
    priority_score: 70
    experiment_level: 1
    depends_on: []
    status: pending

# --- 3. Behaviors ---
behaviors:
  - id: b-01
    hypothesis_id: h-01
    pages: [landing]
    given: "A small lender, landlord, or gig-platform reviewer visits the FraudShield landing page"
    when: "They read the value proposition and see the primary CTA"
    then: "They click 'Scan your document' (>5% of visitors)"
    # CTA DESTINATION CHANGED 2026-11-09. Every prominent CTA on this page sent
    # the visitor to /signup; only a small secondary link reached the free scan.
    # In the days after the free scan shipped (6 Nov) no outside visitor started
    # one, so the primary CTAs now scroll to the free-scan panel instead. The
    # manager asked for this and counts the free-scan test window from the day
    # it goes live. h-01 is unaffected — cta_click still fires on the same
    # button, and the metric is cta_click / visit_landing either way.
    tests:
      - "Landing page renders the primary CTA button"
      - "Clicking the CTA reaches the free-scan panel without asking for an account"
      - "cta_click event fires with the variant slug"
    level: 1
  - id: b-02
    hypothesis_id: h-02
    pages: [landing]
    # REPLACED IN PLACE 2026-11-04. This behavior was the canned sample-scan
    # animation over a fixed document. It now describes a real anonymous scan of
    # the visitor's own image. Replaced rather than retired-plus-new-id because it
    # is one surface and one behavior — a parallel b-13 would double-count against
    # h-02. No anonymous_allowed flag: "/" is already unconditionally public via
    # derive_pages.py auth_landing, and flagging it would inject "/landing" into
    # the derived public-path set the moment b-01 is flagged too, breaking
    # tests/public-routes.test.ts for no gain.
    given: "A visitor with document-review pain is on the landing page and has a document image to check"
    when: "They upload it to the free scan — no account, capped at 3 per visitor and 30 site-wide per day"
    then: "They get a real fraud score, its verdict band and the first two forensic signals, with the remaining count teased behind signup"
    tests:
      - "Free-scan panel renders the words fraud score and the AI privacy disclosure before any upload"
      - "free_scan_start event fires when a document is submitted"
      - "The scan returns exactly two signals plus the total count, never the full breakdown"
      - "An exhausted cap renders a signup CTA rather than an error"
    level: 1
  - id: b-03
    hypothesis_id: h-01
    pages: [signup, dashboard]
    given: "A visitor clicks the CTA"
    when: "They fill in email and password and submit"
    then: "An account is created and they land on the dashboard"
    tests:
      - "Signup form validates email and password input"
      - "User is redirected to the dashboard after signup"
      - "signup_complete event fires"
    level: 2
  - id: b-04
    hypothesis_id: h-03
    pages: [dashboard, scan-result]
    given: "A signed-up user is on the dashboard"
    when: "They upload a pay stub, bank statement, or invoice and submit it for analysis"
    then: "FraudShield runs metadata forensics, cross-document checks, and template matching and returns a fraud score in seconds. PDFs get the full document forensics (producer/creator fingerprinting, template matching, timestamp analysis). Images get a partial analysis from EXIF metadata — editing software in the Software tag, DateTimeOriginal capture date, and absence of EXIF as a screenshot or stripped-metadata signal — and are labelled as partial rather than presented as a complete verdict"
    tests:
      - "Upload accepts PDF and image files and rejects unsupported types"
      - "Scan result renders a 0-100 fraud score with a per-signal breakdown"
      - "Image uploads produce EXIF-derived signals (editor software, capture date, missing EXIF) instead of an empty breakdown"
      - "Image results are labelled partial analysis and direct the user to upload the original PDF for full forensics"
      - "activate event fires when the first fraud score is delivered"
    level: 2
  - id: b-11
    hypothesis_id: h-04
    pages: [terms]
    anonymous_allowed: true
    given: "A visitor is deciding whether to pay for Pro, or has already paid and wants out"
    when: "They open the terms page from the landing footer or the pricing FAQ"
    then: "They read the billing terms in plain words - monthly subscription at the Pro price, cancel any time, access continues to the end of the paid month, no refunds for the current month once charged - and a support address they can actually reach"
    tests:
      - "Terms page states the four billing facts: monthly subscription, Pro price, cancel any time, no refunds once charged"
      - "Pricing FAQ answers how to cancel, what happens after cancelling, and how to get an invoice"
      - "Support address appears on the pricing page, on the terms page, and in the landing footer"
      - "Terms page is reachable by a signed-out visitor without an auth redirect"
      - "Every displayed price derives from PLAN_PRICES, never a hardcoded string"
    level: 1
  - id: b-12
    hypothesis_id: h-11
    pages: [guides/fake-pay-stub, guides/fake-bank-statement, guides/edited-pdf]
    # Public by design: these pages exist to be found by a stranger on Google who
    # has no account. anonymous_allowed drives derive_public_paths(), which is the
    # documented source for the proxy publicPaths array.
    anonymous_allowed: true
    given: "Someone is mid-task reviewing a document and searches for how to tell whether it is fake"
    when: "They land on a FraudShield guide from organic search, read it, and reach the scan prompt"
    then: "They get a complete, honest manual checklist they can act on without an account, and one offer to run the same file through the scan"
    tests:
      - "Each guide page is reachable by a signed-out visitor without an auth redirect"
      - "Each guide carries its own title, description and canonical rather than the homepage metadata"
      - "Each guide renders exactly one Upload it to FraudShield call to action pointing at /signup"
      - "guide_view fires once per guide load carrying that guide slug"
      - "Guide prose matches the committed source document word for word"
    level: 1
  - id: b-05
    hypothesis_id: h-06
    pages: [scan-result]
    given: "A user is viewing a completed fraud-score result"
    when: "They click 'Get API access' (fake door)"
    then: "They see a waitlist capture confirming integration interest"
    tests:
      - "API access CTA is visible on the result page"
      - "Clicking it fires api_interest_click and shows the waitlist capture"
    level: 2
  - id: b-06
    hypothesis_id: h-04
    pages: [pricing, scan-result]
    given: "A user has used all of their free scans"
    when: "They click 'Upgrade' and complete Stripe checkout"
    then: "Their plan is upgraded and additional scan quota is unlocked"
    tests:
      - "Free-scan limit prompt appears after the free quota is exhausted"
      - "Stripe checkout redirects back to a confirmation state"
      - "subscription_activated event fires on completed checkout"
      - "The Upgrade CTA is hidden until the user is both signed in and activated"
      - "The attribution relay prefers the user record and falls back to the client value"
    level: 3
  - id: b-07
    actor: system
    trigger: "stripe webhooks: checkout.session.completed, invoice.paid, invoice.payment_failed, customer.subscription.deleted"
    hypothesis_id: h-04
    given: "A Stripe subscription lifecycle event arrives"
    when: "The webhook is received"
    then: "The subscription row reflects the new state - active on first payment and on renewal, past_due on a failed payment, canceled when it ends - and the matching paid-funnel event fires"
    tests:
      - "subscriptions table row is set to status='active' for the user"
      - "User scan quota reflects the paid plan"
    level: 3
  - id: b-08
    hypothesis_id: h-05
    pages: [dashboard, scan-result]
    given: "A user has run at least one scan"
    when: "They return within 14 days and submit another document"
    then: "A second fraud score is delivered and the return is recorded"
    tests:
      - "A returning user can run another scan from the dashboard"
      - "retain_return event fires on the second scan"
    level: 3

  - id: b-09
    hypothesis_id: h-01
    pages: [signup, login, dashboard]
    given: "A visitor from a paid ad reaches the signup or login page"
    when: "They click Continue with Google and approve the Google consent screen"
    then: "An account is created with no email-verification round-trip and they land on the dashboard, with the originating gclid and utm_campaign preserved across the OAuth redirect"
    tests:
      - "Continue with Google button renders on both signup and login"
      - "gclid and utm_campaign survive the OAuth round-trip and arrive at /auth/callback"
      - "signup_complete fires server-side with provider=google and the relayed attribution"
      - "Acquisition gclid and utm_campaign are persisted onto the user record on first signup"
    level: 2
  # ADDED 2026-11-09. The per-signal paywall has governed this product since
  # launch but was never declared: b-04 says the result page "renders a
  # per-signal breakdown" with no mention of who may see it, so the rule lived
  # only in code. This behavior writes it down and adds the third tier the
  # manager asked for.
  #
  # Filed under h-04 (monetize) rather than h-03 (does the scan work), because
  # what a tier may see is a pricing decision read through the paywall funnel,
  # not a claim about what the engine detects.
  #
  # b-04 and b-06 are deliberately left untouched: b-04 remains true (the
  # breakdown does render; this behavior says to whom) and b-06 still describes
  # the upgrade flow unchanged.
  - id: b-13
    hypothesis_id: h-04
    pages: [scan-result, dashboard]
    given: "A user who bought a scan pack but never subscribed opens a scan result, or their scan history"
    when: "The result carries at least one forensic signal"
    then: "They see the single top reason the document was flagged - the most serious signal, and the heaviest among equals - while every other signal stays withheld. Pro still shows the full per-signal breakdown; a user who has paid nothing still sees none of it. Buying another pack reveals nothing further: the rest comes with Pro"
    tests:
      - "A scan-pack buyer sees the top reason and cannot reach the full breakdown"
      - "A Pro subscriber still sees every signal, unchanged"
      - "A user who has never paid sees no signal detail, unchanged"
      - "The top reason is the highest-severity signal, then the heaviest, resolved the same way every time"
      - "A result with no signals shows no top reason rather than an empty one"
    level: 3

# --- 4. Journey ---
golden_path:
  - step: "Visit landing page"
    event: visit_landing
    page: landing
  - step: "Click 'Scan your document'"
    event: cta_click
    page: landing
  # INSERTED 2026-11-09 alongside the b-01 CTA repoint. The CTA lands on the
  # free-scan panel, so a visitor now reaches a fraud score BEFORE being asked
  # for an account. Signup follows from the panel's own "See all N signals"
  # CTA rather than from the landing CTA.
  #
  # Expect signup_complete / cta_click to fall sharply once this is live. That
  # is the change working, not a regression: the CTA stopped pointing at signup.
  - step: "Scan a document free, without an account"
    event: free_scan_complete
    page: landing
  - step: "Create account (email + password)"
    event: signup_complete
    page: signup
  - step: "Upload a document and receive a fraud score"
    event: activate
    page: scan-result
target_clicks: 4

