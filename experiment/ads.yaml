  import_method: posthog_webhook
  attribution_window_days: 30
  notes: 'PostHog captures gclid from URL params via the pre-hydration script in

    src/app/layout.tsx and registers it as a super-property. Every subsequent

    event — including activate — automatically carries gclid. Wire PostHog''s

    Google Ads Conversion Tracking integration after Phase 1 setup; until then,

    conversions can be imported manually via the Google Ads UI by uploading a

    CSV of (gclid, conversion_time, conversion_name) tuples exported from PostHog.

    '
budget:
  click_target: 300
  total_budget_cents: 150000
  daily_budget_cents: 10000
  duration_days: 15
  initial_max_cpc_cents: 140
  bidding_strategy: manual_cpc
  cap_override_approved_by: Draft Lab (Alan)
  duration_note: '15 days, not the playbook''s 21. The playbook pairs 21 days with a USD 20/day budget
    so daily x duration stays under the cap. At the approved USD 100/day, 21 days would permit USD 2,100
    -- USD 600 past the approved cap. 15 x 100 = 1500 exactly restores the fail-safe. The end date is
    a fail-safe, not a deadline: stop at 300 clicks or the cap, and extend the date if neither is hit.'
guardrails:
  max_cpc_cents: 500
  min_daily_clicks: 3
  auto_pause_rules:
  - condition: daily_spend_cents > daily_budget_cents * 1.2
    action: pause_campaign
    reason: Daily spend exceeded budget by 20%
  - condition: ctr < 0.005 AND impressions > 1000
    action: pause_ad_group
    reason: CTR below 0.5% after 1000 impressions — copy is failing
  - condition: cost_per_click_cents > 500
    action: pause_keyword
    reason: CPC exceeded ~2x guardrail ($2.40) — keyword is over-competitive
thresholds:
  expected_clicks: 300
  expected_signups: 150
  expected_activations: 6
  go_signal: 'pay_intent rate >= 0.02 of paid clicks (theta_2) over >= 300 clicks

    -> GO: eligible for Phase 3, ranked by revenue_intent_per_click

    '
  no_go_signal: 'pay_intent rate < 0.02 over >= 300 clicks -> NO_GO (vanity: used free, will not pay)

    OR spend reaches the $1,500 cap below 300 clicks -> affordability signal

    '
currency: SGD
currency_note: 'The Google Ads account bills in SGD but every approved figure below is USD, derived from
  the USD 60/mo reference price. Entered into Google Ads at ~1.35 SGD/USD: bid SGD 1.90, daily SGD 135,
  ceiling SGD 6.75, cap SGD 2025. The validator is currency-blind, so it would accept SGD figures as if
  they were dollars -- keep this note when editing. Phase 1''s recorded avg CPC of 3.80 was almost certainly
  SGD (~USD 2.85), which means the Phase 1b bid cut may have been triggered by a currency mismatch rather
  than real payback failure.'
