notes_phase2:
  google_forecast_at_launch: 165 clicks/week at SGD 1.91 avg CPC (~USD 1.41), SGD 315/week spend. Implies
    300 clicks in ~13 days for ~USD 433 -- well inside both the 15-day end date and the USD 1,500 cap.
  market_is_rank_limited: Google recommended SGD 45/day and its forecast did not change when the daily
    budget was raised from SGD 100 to 135. Only ~SGD 45/day of inventory exists at a SGD 1.90 bid, so
    volume is constrained by bid and Ad Rank, not budget. Raising the daily budget buys nothing; raising
    the bid or improving Quality Score does.
  known_attribution_gap: 'FIXED 2026-08-17 (branch fix/phase2-verdict-sourcing). Returning Phase-1 users
    who clicked a Phase-2 ad and LOGGED IN rather than signing up never received Phase-2 attribution:
    persistAttribution ran only inside the fresh-signup branch, and acquisition_* is first-touch-wins.
    Their clicks counted in the denominator while their pay_intents were dropped from the numerator as
    unattributed, biasing the measured rate downward. persistAttribution now runs on every authenticated
    callback and records last_touch_gclid / last_touch_utm_campaign alongside the first-touch pair;
    resolvePayIntentAttribution prefers last touch. NOT retroactive -- users who logged in before this
    shipped keep their old attribution, so clicks from 11-17 Aug may still be under-attributed.'
  verdict_sourcing: 'Verified against .claude/scripts/lib/iterate_cross_verdicts.py on 2026-08-17.
    DENOMINATOR is ga_clicks, read from the Google Ads CSV export -- not PostHog. pay_intent_rate =
    pay_intents / ga_clicks, so the ~67% client-side tracking gap cannot inflate the measured rate; that
    half is already immune. NUMERATOR is db_pay_intents_paid (the paid-gclid subset of public.pay_intent)
    when is_trusted_db_pay_intents passes, otherwise it falls back to PostHog event counts, which
    undercount and bias toward a false NO_GO. OPEN ACTION: confirm fraudshield has a Supabase mapping in
    the centrally-managed iterate-cross config so pay_intent_source resolves to db_real, not ph. PostHog
    is for funnel shape only and must never supply either side of the GO/NO-GO arithmetic.'
  tracking_capture_rate: 'WITHDRAWN -- do not act on this. The ~67% raised by the TL on 2026-08-17 was
    2 PostHog paid visitors over 3 Google Ads clicks, all-time on this campaign at ~6 days old. A single
    bounce before hydration explains it entirely; the sample cannot support any conclusion and the TL
    retracted the flag the same day. No tracking defect has been measured on fraudshield.
    DEFINITION (verified in iterate_cross_verdicts.py): capture_rate = gclid_visitors / ga_clicks --
    PostHog paid visitors carrying a gclid, over Google Ads clicks. It measures client-side capture loss
    (bounce before hydration, privacy browsers, invalid-click credits), NOT verdict accuracy; the verdict
    denominator is ga_clicks either way -- see verdict_sourcing above.
    RE-READ at ~100 clicks (~8 days into the SGD 81/day sprint), not before. Healthy is 85-90%+ (botscore
    reads 94%). Only if it is genuinely below ~85% at that volume is a fix warranted -- the candidate is
    server-side paid-click capture in src/proxy.ts, which would record the click before any client JS
    runs. Deliberately NOT built in Aug 2026: there was no evidence of a problem to fix.'
  ad_strength: Average, deliberately. H1 and H2 are pinned so the product name and value prop always appear,
    which caps Ad Strength. Ad Strength is a Google content recommendation and does not affect the auction.
