# EVENTS.yaml — Analytics Event Dictionary (FraudShield)
#
# Generated by /spec from behaviors, hypotheses, and golden_path.
# Rules:
#   1. Every event has funnel_stage: reach|demand|activate|monetize|retain
#   2. Naming: <object>_<action> snake_case
#   3. funnel_stage is the cross-MVP standardization layer

global_properties:
  project_name:
    description: From experiment.yaml `name` field. Identifies which experiment this data belongs to.
    type: string
    required: true
  project_owner:
    description: From experiment.yaml `owner` field. Identifies who owns this experiment.
    type: string
    required: true

events:
  # --- reach ---
  visit_landing:
    funnel_stage: reach
    trigger: User loads the landing page
    properties:
      variant:
        type: string
        required: false
        description: Variant slug from experiment.yaml variants
      gclid:
        type: string
        required: false
        description: Google Click ID — captured from URL params in src/app/layout.tsx and auto-attached as a PostHog super-property to every subsequent event
      click_id:
        type: string
        required: false
        description: Generic click ID alias for cross-channel attribution (currently mirrors gclid for Google Ads)
      utm_source:
        type: string
        required: false
        description: utm_source from URL params — captured pre-hydration in layout.tsx and registered as super-property
      utm_medium:
        type: string
        required: false
        description: utm_medium from URL params
      utm_campaign:
        type: string
        required: false
        description: utm_campaign from URL params
      utm_content:
        type: string
        required: false
        description: utm_content from URL params (used for variant + sitelink attribution)
      utm_term:
        type: string
        required: false
        description: utm_term from URL params (keyword)
  demo_view:
    funnel_stage: reach
    trigger: Visitor opens or runs the live sample-scan demo on the landing page
    properties:
      variant:
        type: string
        required: false
        description: Variant slug from experiment.yaml variants

  # --- demand ---
  cta_click:
    funnel_stage: demand
    trigger: User clicks the primary 'Scan your document' CTA
    properties:
      variant:
        type: string
        required: false
        description: Variant slug from experiment.yaml variants
  feature_interest_click:
    funnel_stage: demand
    trigger: >-
      A user clicks a clearly-labelled "coming soon" control for a capability
      the product does NOT have. A demand signal only: the label must say the
      feature does not exist yet, and nothing about the click may imply it was
      performed.
    properties:
      feature:
        type: string
        required: true
        description: Which unbuilt capability was asked for (e.g. cross_document)
      doc_type:
        type: string
        required: false
        description: Document type of the result being viewed

  api_interest_click:
    funnel_stage: demand
    trigger: An activated user clicks 'Get API access' (fake door) on a scan result
    properties:
      doc_type:
        type: string
        required: false
        description: Document type of the result being viewed (pay_stub | bank_statement | invoice)

  # --- activate ---
  signup_start:
    funnel_stage: activate
    trigger: Signup page mounts / user begins account creation
    properties:
      method:
        type: string
        required: false
        description: How the user is signing up (email | google). Fired before the OAuth redirect, which tears down the page.
  signup_complete:
    funnel_stage: activate
    trigger: Account is successfully created and the user lands on the dashboard. Fired server-side from /auth/callback, the shared chokepoint for OAuth, email-confirm, and magic-link signups.
    properties:
      provider:
        type: string
        required: false
        description: Supabase auth provider that created the account (email | google)
      method:
        type: string
        required: false
        description: Mirrors provider for funnel consistency with signup_start (email | google)
      gclid:
        type: string
        required: false
        description: Google Click ID relayed across the OAuth redirect via redirectTo params with a __fs_attr cookie fallback. The server cannot read the sessionStorage copy that layout.tsx captures, so this relay is the only attribution channel for OAuth signups.
      utm_campaign:
        type: string
        required: false
        description: utm_campaign relayed across the OAuth redirect alongside gclid
  activate:
    funnel_stage: activate
    trigger: User uploads a document and receives their first fraud score
    properties:
      doc_type:
        type: string
        required: true
        description: Document type analyzed (pay_stub | bank_statement | invoice)
      fraud_score:
        type: number
        required: false
        description: Returned fraud score (0-100)

  # --- monetize ---
  # Fake door for the Google Ads Phase 2 value screen. Deliberately has NO
  # `requires: [payment]` — it fires on an Upgrade click that never charges, so
  # it must stay independent of whether the payment stack is wired.
  paywall_shown:
    funnel_stage: monetize
    trigger: >-
      A paywall surface renders for a user who cannot proceed without upgrading.
      Fires once per mount, not per interaction, so it measures how many people
      REACHED the ask — the denominator pay_intent was previously missing.
    properties:
      surface:
        type: string
        required: true
        description: >-
          Which paywall the user hit — locked_signals, scan_result_quota,
          dashboard_quota, or pricing. Distinguishes the four asks so a low
          pay_intent rate can be traced to the surface that failed.
      signal_count:
        type: number
        required: false
        description: >-
          Forensic signals withheld behind the lock. Only meaningful on the
          locked_signals surface; absent elsewhere.

  # --- Phase 3 paid funnel ---
  # These five names are read literally by the fleet readiness check as the paid
  # funnel, so they are NOT free to rename. checkout_started and
  # subscription_activated replace the earlier checkout_start / pay_success.
  checkout_started:
    funnel_stage: monetize
    trigger: >-
      User clicks Upgrade and a Stripe Checkout Session is requested.

      POPULATION CHANGED 2026-10-16, and rates before and after are not
      comparable. The pricing page used to refuse checkout to a signed-in user
      who had never received a fraud score, so their click fired nothing - by
      design, because Phase 2 asked whether people who had USED the product
      would pay, and a click from someone who had scanned nothing measured
      curiosity. With real checkout live, those users can buy, so the event now
      fires for them. The pricing-page denominator grows accordingly. The
      scan_result surface is unaffected.
    requires: [payment]
    properties:
      plan:
        type: string
        required: false
        description: Plan the user is upgrading to
      surface:
        type: string
        required: false
        description: >-
          Which CTA opened checkout - pricing or scan_result. Preserves the
          per-surface diagnostic that paywall_shown established.
  subscription_activated:
    funnel_stage: monetize
    trigger: >-
      Stripe confirms the first payment (checkout.session.completed) and the
      subscription is marked active. Server-side only.
    requires: [payment]
    properties:
      plan:
        type: string
        required: false
        description: Plan purchased
      amount:
        type: number
        required: false
        description: Amount charged in the smallest currency unit
  invoice_paid:
    funnel_stage: retain
    trigger: >-
      A renewal invoice is paid (invoice.paid, billing_reason renewal). This is
      the month-over-month retention signal - it is deliberately NOT
      subscription_activated, which would double-count renewals as new sales.
    requires: [payment]
    properties:
      amount:
        type: number
        required: false
        description: Amount charged in the smallest currency unit
      billing_reason:
        type: string
        required: false
        description: Stripe billing_reason, so a first invoice can be told from a renewal
  payment_failed:
    funnel_stage: retain
    trigger: A renewal payment fails (invoice.payment_failed). Involuntary churn signal.
    requires: [payment]
    properties:
      amount:
        type: number
        required: false
        description: Amount that failed, in the smallest currency unit
  subscription_canceled:
    funnel_stage: retain
    trigger: >-
      The customer asks to cancel. Fired from customer.subscription.updated the
      moment cancel_at is scheduled -- NOT from customer.subscription.deleted,
      which does not arrive until the paid month elapses up to 30 days later.
      Reported once per cancellation; the elapsed-cancellation handler suppresses
      a second report using the pending flag on the row.
    requires: [payment]
    properties:
      plan:
        type: string
        required: false
        description: Plan that was cancelled
      cancel_feedback:
        type: string
        required: false
        description: >-
          Stripe's structured reason from the billing portal's cancel survey
          (cancellation_details.feedback), e.g. too_expensive, missing_features,
          unused. Absent when the customer skipped the question.
      cancel_comment:
        type: string
        required: false
        description: >-
          Free-text the customer typed alongside it
          (cancellation_details.comment). Usually absent.
  # --- retain ---
  retain_return:
    funnel_stage: retain
    trigger: A returning user (after 24h) submits another document scan

  feedback_submitted:
    funnel_stage: activate
    trigger: User submits post-activation feedback widget
    properties:
      source:
        type: string
        required: false
        description: "How the user found the product (google, social, friend, other)"
      feedback:
        type: string
        required: false
        description: Free-text feedback from the user
      activation_action:
        type: string
        required: true
        description: What activation action preceded this (from experiment.yaml thesis)

  # --- Why a checkout did not convert ---
  # subscription_canceled explains why a PAYING customer left. This explains why
  # someone who reached checkout never became one — the larger and, until now,
  # completely dark population.
  checkout_abandon_reason:
    funnel_stage: monetize
    trigger: >-
      A user who reached Stripe Checkout and did not pay answers the one-question
      prompt on /pricing?checkout=cancelled. Self-reported and optional, so the
      count is a sample of abandoners rather than all of them — read it against
      checkout_started, never as a total.
    requires: [payment]
    properties:
      reason:
        type: string
        required: true
        description: >-
          One of price, unsure_fit, need_team_invoice, just_looking, or skipped.
          "skipped" is recorded deliberately: a dismissal is a real answer about
          how willing abandoners are to explain themselves, and dropping it would
          make the other four look more representative than they are.
      reason_text:
        type: string
        required: false
        description: >-
          Optional free text. Absent when left blank. Trimmed and capped before
          sending — this field is user input on a public page.

  # --- One-time purchases ---
  one_time_purchase:
    funnel_stage: monetize
    trigger: >-
      A one-time scan pack is paid for (checkout.session.completed in payment
      mode). Deliberately NOT subscription_activated: that event is read
      literally as the paid SUBSCRIPTION funnel, and a pack buyer has not
      subscribed to anything. Counting them there would overstate subscribers
      and hide the thing the packs were added to measure -- whether the $60/mo
      commitment, rather than the product, is what people are refusing.
    requires: [payment]
    properties:
      pack:
        type: string
        required: true
        description: Pack id — scan_1 or scan_5.
      scans:
        type: number
        required: false
        description: Scans granted by this purchase.
      amount:
        type: number
        required: false
        description: Amount charged in cents.
